<svg xmlns="http://www.w3.org/2000/svg" width="750" height="750" viewBox="0 0 750 750">
  <rect width="750" height="750" fill="#f5f6f8"/>
  <rect x="30" y="28" width="690" height="694" rx="32" fill="#ffffff"/>
  <g font-family="Arial, PingFang SC, sans-serif" fill="#17243a">
    <text x="70" y="72" font-size="23" font-weight="700">支付宝 · 基金持仓</text>
